
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ordem de Serviço</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
<div class="container">
<a class="navbar-brand fw-bold" href="index.html">DS • Bootstrap 5</a>
<button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#menu"><span class="navbar-toggler-icon"></span></button>
<div class="collapse navbar-collapse" id="menu">
<ul class="navbar-nav ms-auto">
<li class="nav-item"><a class="nav-link" href="index.html">Início</a></li>
<li class="nav-item"><a class="nav-link" href="desafio01.html">Desafio 01</a></li>
<li class="nav-item"><a class="nav-link" href="desafio02.html">Desafio 02</a></li>
<li class="nav-item"><a class="nav-link" href="desafio03.html">Desafio 03</a></li>
<li class="nav-item"><a class="nav-link active" href="desafio04.html">Desafio 04</a></li>
<li class="nav-item"><a class="nav-link" href="desafio05.html">Desafio 05</a></li>
</ul>
</div>
</div>
</nav>
<main class="container py-5">
<div class="row justify-content-center">
<div class="col-lg-9">
<div class="card shadow border-0">
<div class="card-header bg-warning py-4">
<h2 class="fw-bold mb-1">Ordem de Serviço</h2>
<p class="mb-0">Formulário de atendimento e agendamento</p>
</div>
<div class="card-body p-4">
<form id="formulario">
<div class="row g-3">
<div class="col-md-6">
<label class="form-label fw-semibold">Nome completo</label>
<input type="text" class="form-control" id="nome" placeholder="Digite seu nome" required>
</div>
<div class="col-md-6">
<label class="form-label fw-semibold">Telefone</label>
<div class="input-group">
<span class="input-group-text">+55</span>
<input type="tel" class="form-control" id="telefone" placeholder="(41) 99999-9999" required>
</div>
</div>
<div class="col-md-6">
<label class="form-label fw-semibold">E-mail</label>
<input type="email" class="form-control" id="email" placeholder="seuemail@email.com" required>
</div>
<div class="col-md-6">
<label class="form-label fw-semibold">Tipo de serviço</label>
<select class="form-select" id="servico" required>
<option value="">Selecione um serviço</option>
<option>Manutenção de computador</option>
<option>Instalação de programas</option>
<option>Formatação</option>
<option>Configuração de rede</option>
<option>Suporte técnico</option>
</select>
</div>
<div class="col-md-6">
<label class="form-label fw-semibold">Data do agendamento</label>
<input type="date" class="form-control" id="data" required>
</div>
<div class="col-md-6">
<label class="form-label fw-semibold">Horário</label>
<select class="form-select" id="horario" required>
<option value="">Selecione</option>
<option>08:00</option>
<option>09:00</option>
<option>10:00</option>
<option>13:00</option>
<option>14:00</option>
<option>15:00</option>
<option>16:00</option>
</select>
</div>
<div class="col-12">
<label class="form-label fw-semibold">Descrição do problema</label>
<textarea class="form-control" id="descricao" rows="4" placeholder="Descreva o que precisa ser realizado..." required></textarea>
</div>
<div class="col-12">
<div class="form-check">
<input class="form-check-input" type="checkbox" id="confirmacao" required>
<label class="form-check-label" for="confirmacao">Confirmo que as informações estão corretas.</label>
</div>
</div>
<div class="col-12 d-grid">
<button type="submit" class="btn btn-warning btn-lg fw-bold">Enviar solicitação</button>
</div>
</div>
</form>
<div id="resultado" class="mt-4"></div>
</div>
</div>
</div>
</div>
</main>
<footer class="bg-dark text-white text-center py-3">Sistema de Atendimento • SESI/SENAI</footer>
<script>
document.getElementById("formulario").addEventListener("submit",function(e){
e.preventDefault();
const nome=document.getElementById("nome").value;
const servico=document.getElementById("servico").value;
const data=document.getElementById("data").value;
const horario=document.getElementById("horario").value;
document.getElementById("resultado").innerHTML=`
<div class="alert alert-success">
<h5 class="fw-bold">Solicitação registrada!</h5>
<p class="mb-1">Cliente: ${nome}</p>
<p class="mb-1">Serviço: ${servico}</p>
<p class="mb-1">Data: ${data}</p>
<p class="mb-0">Horário: ${horario}</p>
</div>`;
this.reset();
});
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
